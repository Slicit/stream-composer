# Overlay: publish the web interface straight to the host over plain HTTP.
#
# Use this on a LAN, behind your own reverse proxy, or while evaluating.
# There is no TLS here, so sign-in credentials travel in the clear — do not
# expose this to the internet. Use docker-compose.tls.yml for that.

services:
  composer:
    ports:
      - "${HTTP_PORT:-8080}:3000"
