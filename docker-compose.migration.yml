# Migration dev stack — the Go data plane and the Rails control plane,
# standing next to (never inside) the existing Node service and networks.
# Everything here is prefixed `scmig-` and lives on its own network/ports so
# it can run alongside both the existing stream-composer stack and
# unrelated projects on the same host (e.g. siberian-next) with zero
# collisions.
#
# Usage:
#   docker compose -f docker-compose.migration.yml up -d --build
#
# This does not publish anything to the internet — every port below is for
# local/dev access only. INTERNAL_SECRET/POSTGRES_PASSWORD/
# INTERNAL_API_TOKEN are throwaway dev values; never reuse them for a real
# deployment.

name: sc-migration

services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: scmig-mediamtx
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://dataplane:8080/internal/${INTERNAL_SECRET:-migration-dev-secret}/mediamtx/auth
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "11935:1935"   # RTMP ingest, for smoke-testing a publish with ffmpeg
      - "19997:9997"   # control API, dev convenience only
    networks: [scmig-net]

  dataplane:
    build: ./go-service
    container_name: scmig-dataplane
    restart: unless-stopped
    depends_on: [mediamtx, rails]
    environment:
      PORT: 8080
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_WEBRTC: http://mediamtx:8889
      MEDIAMTX_HLS: http://mediamtx:8888
      MEDIAMTX_INTERNAL_USER: composer
      MEDIAMTX_INTERNAL_PASSWORD: ${INTERNAL_SECRET:-migration-dev-secret}
      # The real integration: stream data comes from Rails now, not the
      # JSON file. See internal/streamstore.RailsBridge. Same shared
      # secret as INTERNAL_API_TOKEN below.
      RAILS_INTERNAL_API_URL: http://rails:3000
      RAILS_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-migration-dev-internal-api-token}
      # Set this instead (and unset the two above) to fall back to the
      # legacy JSON-file bridge for standalone testing without Rails —
      # bind-mount a directory onto /data and point this at a file in it.
      STREAM_CONFIG_PATH: ${STREAM_CONFIG_PATH:-}
    volumes:
      - ./migration-data:/data:ro
    ports:
      - "18080:8080"
    networks: [scmig-net]

  postgres:
    image: postgres:16-alpine
    container_name: scmig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scmig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migration-dev-secret}
      POSTGRES_DB: scmig_development
    volumes:
      - scmig-postgres-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"   # dev convenience only, not for internet exposure
    networks: [scmig-net]

  rails:
    build:
      context: ./rails-service
      dockerfile: Dockerfile.dev
    container_name: scmig-rails
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgres://scmig:${POSTGRES_PASSWORD:-migration-dev-secret}@postgres:5432/scmig_development
      RAILS_ENV: development
      # Shared with dataplane's RAILS_INTERNAL_API_TOKEN above — gates
      # Internal::StreamsController, the only thing the Go service is
      # allowed to read from Rails.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-migration-dev-internal-api-token}
    ports:
      - "13000:3000"
    networks: [scmig-net]

networks:
  scmig-net:
    name: scmig-net
    driver: bridge

volumes:
  scmig-postgres-data:
    name: scmig-postgres-data
