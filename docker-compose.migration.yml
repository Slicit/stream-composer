# Migration dev stack — the Go data plane, the Rails control plane, and the
# React frontend, standing next to (never inside) the existing Node service
# and networks.
# Everything here is prefixed `scmig-` and lives on its own network/ports so
# it can run alongside both the existing stream-composer stack and
# unrelated projects on the same host (e.g. siberian-next) with zero
# collisions.
#
# Usage:
#   MEDIAMTX_PUBLIC_HOST=<box's LAN/public IP> docker compose -f docker-compose.migration.yml up -d --build
#
# MEDIAMTX_PUBLIC_HOST is not optional if you want to actually watch a
# stream from a real browser (as opposed to verifying signaling/access
# control with curl or tooling on the container network) — see the
# mediamtx service's own comment below for why. It is not persisted
# anywhere (no .env file for this compose project, deliberately, so it
# never bleeds into the unrelated production docker-compose.yml in this
# same directory), so every `docker compose ... up` touching the mediamtx
# service needs it passed again, including a plain `up -d` with no
# service argument.
#
# This does not publish anything to the internet — every port below is for
# local/dev access only. INTERNAL_SECRET/POSTGRES_PASSWORD/
# INTERNAL_API_TOKEN are throwaway dev values; never reuse them for a real
# deployment.

name: sc-migration

services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: scmig-mediamtx
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://dataplane:8080/internal/${INTERNAL_SECRET:-migration-dev-secret}/mediamtx/auth
      # Without this, MediaMTX only advertises ICE candidates on its
      # container-network address, which a real browser outside the
      # compose network can never reach — WebRTC signaling succeeds (the
      # WHEP POST gets its 201/SDP answer) but ICE then times out and the
      # session closes with nothing ever actually playing. Set this to
      # the dev box's real LAN/public address to watch a stream from an
      # actual browser rather than only from tooling on the same network.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_HOST:-}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "11935:1935"   # RTMP ingest, for smoke-testing a publish with ffmpeg
      - "19997:9997"   # control API, dev convenience only
      # Not remapped (8189:8189, not e.g. 18189:8189): the port number is
      # embedded directly in the SDP candidate MediaMTX advertises, so a
      # remapped external port would tell the browser to dial a port
      # nothing is actually listening on from outside the container.
      - "8189:8189/udp"
    networks: [scmig-net]

  dataplane:
    build: ./go-service
    container_name: scmig-dataplane
    restart: unless-stopped
    depends_on: [mediamtx, rails]
    environment:
      PORT: 8080
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_WEBRTC: http://mediamtx:8889
      MEDIAMTX_HLS: http://mediamtx:8888
      MEDIAMTX_INTERNAL_USER: composer
      MEDIAMTX_INTERNAL_PASSWORD: ${INTERNAL_SECRET:-migration-dev-secret}
      # The real integration: stream data comes from Rails now, not the
      # JSON file. See internal/streamstore.RailsBridge. Same shared
      # secret as INTERNAL_API_TOKEN below.
      RAILS_INTERNAL_API_URL: http://rails:3000
      RAILS_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-migration-dev-internal-api-token}
      # Set this instead (and unset the two above) to fall back to the
      # legacy JSON-file bridge for standalone testing without Rails —
      # bind-mount a directory onto /data and point this at a file in it.
      STREAM_CONFIG_PATH: ${STREAM_CONFIG_PATH:-}
    volumes:
      - ./migration-data:/data:ro
    ports:
      - "18080:8080"
    networks: [scmig-net]

  # The dedicated ffmpeg compositor — see go-service/internal/compositor's
  # package comment. A separate container on purpose: a heavy or
  # misbehaving composition job must never affect dataplane's own
  # low-latency work (the MediaMTX auth hook, WHEP proxying for ordinary
  # viewers). Nothing yet tells it to actually run a job (that's the data
  # plane's orchestration, a later phase) — for now it's reachable
  # directly for manual validation, see go-service/README.md.
  compositor:
    build:
      context: ./go-service
      dockerfile: Dockerfile.compositor
    container_name: scmig-compositor
    restart: unless-stopped
    depends_on: [mediamtx]
    environment:
      PORT: 8080
      MEDIAMTX_INTERNAL_USER: composer
      MEDIAMTX_INTERNAL_PASSWORD: ${INTERNAL_SECRET:-migration-dev-secret}
    ports:
      - "18081:8080"
    networks: [scmig-net]

  # A real SMTP server that never leaves this box — self-registration's
  # confirmation email actually goes through a genuine SMTP handshake
  # instead of Rails' :test-delivery log-only fallback, so the full flow
  # (including a real e2e spec) can be proven end to end. Its web UI/API
  # on :8025 lists every message it's ever received; nothing it accepts
  # is ever relayed anywhere.
  mailpit:
    image: axllent/mailpit:latest
    container_name: scmig-mailpit
    restart: unless-stopped
    ports:
      - "18025:8025"   # web UI + REST API (see e2e/global-setup.ts)
    networks: [scmig-net]

  postgres:
    image: postgres:16-alpine
    container_name: scmig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scmig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migration-dev-secret}
      POSTGRES_DB: scmig_development
    volumes:
      - scmig-postgres-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"   # dev convenience only, not for internet exposure
    networks: [scmig-net]

  rails:
    build:
      context: ./rails-service
      dockerfile: Dockerfile.dev
    container_name: scmig-rails
    restart: unless-stopped
    depends_on: [postgres, mailpit]
    environment:
      # docker compose does NOT propagate the invoking shell's arbitrary
      # env vars into the container automatically — only explicit
      # interpolation like this does. Without it, development.rb's
      # `if ENV["CI"].present?` block never sees CI=true inside the
      # container even when the CI runner's own shell has it, which is
      # exactly what broke the e2e job's first real run (global-setup.ts's
      # docker exec hit the real ActiveRecord::Encryption config, not the
      # CI-only fallback).
      CI: ${CI:-}
      DATABASE_URL: postgres://scmig:${POSTGRES_PASSWORD:-migration-dev-secret}@postgres:5432/scmig_development
      # Real SMTP delivery through mailpit (see that service's own
      # comment) rather than Rails' :test fallback — no username/password:
      # mailpit accepts unauthenticated SMTP, and the mail gem skips AUTH
      # entirely when SMTP_USERNAME is blank.
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: dev@stream-composer.test
      PUBLIC_HOST: localhost:15173
      # Lets `bundle exec rspec` run correctly no matter how it's invoked
      # (RAILS_ENV defaults to "test" via rails_helper.rb) — see the
      # comment on config/database.yml's test: section for why this has
      # to be spelled out explicitly rather than relying on DATABASE_URL's
      # normal auto-merge.
      TEST_DATABASE_URL: postgres://scmig:${POSTGRES_PASSWORD:-migration-dev-secret}@postgres:5432/scmig_test
      RAILS_ENV: development
      # Shared with dataplane's RAILS_INTERNAL_API_TOKEN above — gates
      # Internal::StreamsController, the only thing the Go service is
      # allowed to read from Rails.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-migration-dev-internal-api-token}
      # The other direction: lets Rails call dataplane's own
      # /internal/{token}/... routes for the admin Server/Stats page.
      # Same value as dataplane's MEDIAMTX_INTERNAL_PASSWORD above.
      INTERNAL_SECRET: ${INTERNAL_SECRET:-migration-dev-secret}
      DATAPLANE_INTERNAL_URL: http://dataplane:8080
    ports:
      - "13000:3000"
    networks: [scmig-net]

  react:
    build:
      context: ./react-app
      dockerfile: Dockerfile.dev
    container_name: scmig-react
    restart: unless-stopped
    depends_on: [rails, dataplane]
    environment:
      # Vite's dev-server proxy targets — see vite.config.ts. The browser
      # never talks to Rails or the Go data plane directly; every request
      # goes through Vite's own origin, which keeps the sc_session cookie
      # same-origin with zero CORS/SameSite configuration needed for
      # local dev.
      VITE_RAILS_ORIGIN: http://rails:3000
      VITE_DATAPLANE_ORIGIN: http://dataplane:8080
    ports:
      - "15173:5173"
    networks: [scmig-net]

networks:
  scmig-net:
    name: scmig-net
    driver: bridge

volumes:
  scmig-postgres-data:
    name: scmig-postgres-data
