name: Release

# Cuts a pinned, versioned release of the go-rails-react stack: a `v*` tag
# builds and publishes semver-tagged rails/dataplane images (alongside the
# day-to-day `stable` channel that build-go-rails-react-images.yml already
# keeps current on every push to main) and a GitHub Release carrying the
# deployment files an install can pin to. No push-to-main trigger here —
# publishing on every main push is already that other workflow's job.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RAILS_IMAGE: ghcr.io/${{ github.repository_owner }}/stream-composer-rails
  DATAPLANE_IMAGE: ghcr.io/${{ github.repository_owner }}/stream-composer-dataplane

jobs:
  rails:
    name: Build and publish rails (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RAILS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Same build definition as build-go-rails-react-images.yml's rails
      # job (see there for why: multi-stage react-build -> gems/precompile
      # -> slim runtime, no secret baked into the image) — this one just
      # tags the result with the release's version instead of a channel.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rails-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Stream Composer (Rails control plane)
            org.opencontainers.image.description=API, admin/self-service CRUD, auth, and the built React SPA
          cache-from: type=gha,scope=rails
          cache-to: type=gha,mode=max,scope=rails

  dataplane:
    name: Build and publish dataplane (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DATAPLANE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./go-service
          file: go-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Stream Composer (Go data plane)
            org.opencontainers.image.description=Media proxy, restream/audio-monitor supervision, viewer/channel state
          cache-from: type=gha,scope=dataplane
          cache-to: type=gha,mode=max,scope=dataplane

  release:
    name: Publish the release bundle
    runs-on: ubuntu-latest
    needs: [rails, dataplane]
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the deployment bundle
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="stream-composer-$VERSION"
          mkdir -p "$STAGE"

          cp -R \
            docker-compose.go-rails-react.yml docker-compose.go-rails-react.tls.yml \
            .env.go-rails-react.example install-go-rails-react.sh update-go-rails-react.sh \
            Makefile README.md LICENSE config obs scripts docs \
            "$STAGE/"

          # Pin the bundle to the images built above, not the rolling
          # stable/beta channel install-go-rails-react.sh defaults to.
          sed -i "s/^RAILS_TAG=.*/RAILS_TAG=${VERSION#v}/" "$STAGE/.env.go-rails-react.example"
          sed -i "s/^DATAPLANE_TAG=.*/DATAPLANE_TAG=${VERSION#v}/" "$STAGE/.env.go-rails-react.example"

          tar -czf "stream-composer-$VERSION.tar.gz" "$STAGE"
          sha256sum "stream-composer-$VERSION.tar.gz" > "stream-composer-$VERSION.tar.gz.sha256"
          ls -lh stream-composer-*

      - name: Write the release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat > NOTES.md <<EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-go-rails-react.sh | bash
          \`\`\`

          Tracks the \`stable\` channel (rolling — always the latest \`main\`).
          To pin this exact release instead, download the bundle below; its
          \`.env.go-rails-react.example\` already has \`RAILS_TAG\`/\`DATAPLANE_TAG\`
          set to \`${VERSION#v}\`.

          ## Upgrade

          \`\`\`bash
          cd /opt/stream-composer-next && ./update-go-rails-react.sh
          \`\`\`

          ## Images

          \`\`\`
          ghcr.io/${{ github.repository_owner }}/stream-composer-rails:${VERSION#v}
          ghcr.io/${{ github.repository_owner }}/stream-composer-dataplane:${VERSION#v}
          \`\`\`
          Built for \`linux/amd64\`.
          EOF

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          generate_release_notes: true
          files: |
            stream-composer-*.tar.gz
            stream-composer-*.tar.gz.sha256
