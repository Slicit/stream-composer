name: CI (Go/Rails/React)

# Test coverage for the go-rails-react stack — separate from ci.yml, which
# is scoped to the pre-migration server/ app and knows nothing about this
# one. Mirrors build-go-rails-react-images.yml's trigger/path-filter shape,
# but filters each service independently rather than bundling rails+react:
# that workflow combines them because the Rails image bundles the built
# SPA, but their test suites don't depend on each other.

on:
  push:
    branches: [main, migration/go-rails-react]
    paths:
      - 'rails-service/**'
      - 'react-app/**'
      - 'go-service/**'
      - 'docker-compose.migration.yml'
      - '.github/workflows/ci-go-rails-react.yml'
  pull_request:
    paths:
      - 'rails-service/**'
      - 'react-app/**'
      - 'go-service/**'
      - 'docker-compose.migration.yml'
      - '.github/workflows/ci-go-rails-react.yml'
  workflow_dispatch:

concurrency:
  group: ci-go-rails-react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rails: ${{ steps.filter.outputs.rails }}
      react: ${{ steps.filter.outputs.react }}
      go: ${{ steps.filter.outputs.go }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Explicit, not left to the action's own default: unset, it falls
          # back to diffing against the repo's default branch (main) for any
          # push not already targeting it. That's always an empty diff here
          # — main is fast-forwarded to match migration/go-rails-react after
          # every push in this repo's own workflow (see every commit
          # message's push step) — so every job would silently skip on
          # every push to that branch. Confirmed live: the commit that added
          # the *workflow line just below skipped all three jobs it was
          # meant to force, for exactly this reason.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A change to this workflow file itself runs all three jobs, not
          # none — the whole point of touching this file is to prove it
          # still exercises every real test suite, and per-service-only
          # filters would skip all of them on a workflow-only commit (as
          # this one, before this line existed, actually did).
          filters: |
            rails:
              - 'rails-service/**'
              - &workflow '.github/workflows/ci-go-rails-react.yml'
            react:
              - 'react-app/**'
              - *workflow
            go:
              - 'go-service/**'
              - *workflow
            # The e2e suite exercises rails+react together against a real
            # docker-compose stack, so it runs whenever either changes —
            # plus the compose file itself, which neither the rails nor
            # react filter above covers (it lives at the repo root, not
            # under either service directory).
            e2e:
              - 'docker-compose.migration.yml'
              - 'rails-service/**'
              - 'react-app/**'
              - *workflow

  rails:
    name: Rails tests
    needs: changes
    if: needs.changes.outputs.rails == 'true'
    runs-on: ubuntu-latest
    services:
      # Reached over localhost, not a service hostname — GitHub Actions
      # publishes service containers straight onto the runner's network
      # namespace, unlike the box's docker-compose network.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scmig
          POSTGRES_PASSWORD: ci-secret
          POSTGRES_DB: scmig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://scmig:ci-secret@localhost:5432/scmig_test
      # rails_helper.rb's maintain_test_schema! always targets config/database.yml's
      # test: section, which only honors TEST_DATABASE_URL (not DATABASE_URL) —
      # see that file's own comment on why. Same value as DATABASE_URL here since
      # this job has no separate development database to protect against.
      TEST_DATABASE_URL: postgres://scmig:ci-secret@localhost:5432/scmig_test
      # Most specs stub this themselves, but pages_spec.rb's "does not shadow
      # a real /internal route" test relies on InternalTokenAuthenticatable
      # actually reaching its wrong-token branch (404) rather than its
      # unset-token branch (401) — needs a real, if arbitrary, value here.
      INTERNAL_API_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rails-service

      - name: Prepare the test database
        working-directory: rails-service
        run: bin/rails db:test:prepare

      - name: Run tests
        working-directory: rails-service
        run: bundle exec rspec

  go:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go-service/go.mod

      - name: gofmt
        working-directory: go-service
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "The above files are not gofmt-clean — run 'gofmt -w' on them."
            exit 1
          fi

      - name: Build, vet, test
        working-directory: go-service
        run: |
          go build ./...
          go vet ./...
          go test ./...

  react:
    name: React tests
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Type check
        working-directory: react-app
        run: npx tsc -b

      - name: Run tests
        working-directory: react-app
        run: npm test

  e2e:
    name: End-to-end tests (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install react-app dependencies
        working-directory: react-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: react-app
        run: npx playwright install --with-deps chromium

      # No RAILS_MASTER_KEY anywhere in this job, deliberately: this stack
      # boots in development mode, same as the dev box, but from a fresh
      # checkout with no access to the real (gitignored) master key that
      # decrypts config/credentials.yml.enc. development.rb's CI-gated
      # block supplies fixed, insecure, disposable ActiveRecord::Encryption
      # keys instead — the same fix test.rb already needed for the rspec
      # job, applied to the one other environment that needs it. Verified
      # directly (not assumed): a throwaway container booted this image in
      # development mode with no master key present and successfully
      # round-tripped an encrypted otp_secret.
      - name: Build and start the dev stack
        env:
          CI: 'true'
        run: docker compose -f docker-compose.migration.yml up -d --build

      - name: Wait for the stack to come up
        run: |
          # react/mailpit respond to HTTP as soon as their own process is
          # listening, regardless of rails' state - but on the dev box this
          # never mattered, since its postgres volume is long-lived and
          # already migrated. CI starts from a brand-new, empty volume, so
          # rails' own boot (its CMD runs db:prepare && db:seed before the
          # server ever listens - see Dockerfile.dev) has to be waited on
          # explicitly too, or global-setup.ts's docker exec ... bin/rails
          # runner races a database that doesn't have its tables yet.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:15173/ >/dev/null \
              && curl -sf http://localhost:18025/api/v1/messages >/dev/null \
              && docker compose -f docker-compose.migration.yml exec -T rails bin/rails runner 'exit(ActiveRecord::Base.connection.table_exists?(:users) ? 0 : 1)' >/dev/null 2>&1; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not come up in time"
          docker compose -f docker-compose.migration.yml logs
          exit 1

      - name: Run Playwright tests
        working-directory: react-app
        env:
          MAILPIT_URL: http://localhost:18025
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: react-app/test-results/
          retention-days: 7

      - name: Tear down the dev stack
        if: always()
        run: docker compose -f docker-compose.migration.yml down -v
