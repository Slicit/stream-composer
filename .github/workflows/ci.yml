name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Check that every source file parses
        working-directory: server
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "All sources parse."

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh scripts/*.sh server/docker-entrypoint.sh

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every overlay combination
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=test/' .env
          sed -i 's/^INTERNAL_SECRET=.*/INTERNAL_SECRET=test/' .env
          sed -i 's/^DOMAIN=.*/DOMAIN=example.com/' .env
          sed -i 's/^ACME_EMAIL=.*/ACME_EMAIL=test@example.com/' .env

          for files in \
            "docker-compose.yml:docker-compose.local.yml" \
            "docker-compose.yml:docker-compose.tls.yml" \
            "docker-compose.yml:docker-compose.local.yml:docker-compose.build.yml"
          do
            echo "::group::$files"
            COMPOSE_FILE="$files" docker compose config --quiet
            echo "ok"
            echo "::endgroup::"
          done

  compose-v1:
    name: Compose v1 fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: The generated fallback is up to date
        run: python3 scripts/make-compat.py --check

      - name: It parses under a real Compose v1, and resolves to the same stack
        # Compose v1 is EOL and unbuildable from source on modern Python, so use
        # the official image. `config` needs no Docker daemon.
        run: |
          python3 scripts/check-compose-parity.py \
            --v1 "docker run --rm -v $PWD:/w -w /w docker/compose:1.29.2"

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: stream-composer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name sc-ci -e SESSION_SECRET=ci -e ADMIN_PASSWORD=ci-password-123 \
            -p 3000:3000 stream-composer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              echo "Health check passed:"
              curl -s http://127.0.0.1:3000/healthz
              echo
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "Service never became healthy. Logs:"
              docker logs sc-ci
              exit 1
            fi
          done

      - name: Check ffmpeg and the login page are present
        run: |
          docker exec sc-ci ffmpeg -hide_banner -version | head -1
          curl -fsS http://127.0.0.1:3000/login | grep -q "Sign in" && echo "Login page renders."

      - name: Tear down
        if: always()
        run: docker rm -f sc-ci || true
