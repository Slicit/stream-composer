<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in — Stream Composer</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%233987e5'/%3E%3Crect x='3' y='4' width='6' height='5' rx='1' fill='white'/%3E%3Crect x='11' y='4' width='6' height='5' rx='1' fill='white' opacity='.7'/%3E%3Crect x='3' y='11' width='14' height='5' rx='1' fill='white' opacity='.85'/%3E%3C/svg%3E">
</head>
<body>
  <main class="login-page">
    <form class="card login-card" id="form" autocomplete="on">
      <div class="brand" style="margin-bottom:1.1rem;">
        <span class="brand-mark">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2" y="3" width="7" height="6" rx="1.4" fill="#fff" opacity=".95"/>
            <rect x="11" y="3" width="7" height="6" rx="1.4" fill="#fff" opacity=".7"/>
            <rect x="2" y="11" width="16" height="6" rx="1.4" fill="#fff" opacity=".85"/>
          </svg>
        </span>
        <span>Stream Composer</span>
      </div>

      <h1 style="margin-bottom:.35rem;">Sign in</h1>
      <p style="color:var(--ink-muted); font-size:.85rem;">Enter your credentials to watch the live grid.</p>

      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>

      <div id="error" class="status is-bad" style="display:none; margin-bottom:.8rem;"><span class="dot"></span><span id="error-text"></span></div>

      <button class="primary" type="submit" id="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>
  </main>

  <script type="module">
    const form = document.getElementById('form');
    const errorBox = document.getElementById('error');
    const errorText = document.getElementById('error-text');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      submit.disabled = true;
      submit.textContent = 'Signing in…';

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `Sign-in failed (${res.status}).`);

        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
        window.location.href = safeNext;
      } catch (err) {
        errorText.textContent = err.message;
        errorBox.style.display = '';
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
